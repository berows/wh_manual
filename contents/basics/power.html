<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전원 On/Off - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">전원 On/Off</h1>
    <h2 class="section-title">전원 켜기</h2>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>전원 버튼 3초 길게 누르기</h3><p>LED가 흰색으로 점등되면서 전원이 켜집니다.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>자동 이전 기기 재연결</h3><p>이전에 연결된 기기가 있다면 자동으로 재연결을 시도합니다. LED가 파란색으로 점등되면 연결 완료입니다.</p></div></div>
    </div>
    <h2 class="section-title">전원 끄기</h2>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>전원 버튼 5초 길게 누르기</h3><p>LED가 붉은색으로 1회 점멸 후 전원이 꺼집니다.</p></div></div>
    </div>
    <div class="flowchart-img-wrap"></div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
