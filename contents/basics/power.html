<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전원 On/Off - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">전원 On/Off</h1>
    <h2 class="section-title">전원 켜기</h2>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>(전원 off 상태) 버튼을 3초 이상 길게 누르기</h3><p>전원이 켜지고 OS가 부팅됩니다.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>(전원 on 상태) 버튼을 짧게 누르기</h3><p>잠자기 모드 활성/비활성</p></div></div>
    </div>
    <h2 class="section-title">전원 끄기</h2>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>전원 버튼 5초 길게 누르기</h3><p>터치 스크린에 종료 확인 버튼을 출력합니다.(확인후 전원종료)</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>전원 버튼 5초 이상 길게 누르기</h3><p>화면 확인을 건너띄고 기기를 강제 종료합니다.(비상시)</p></div></div>
    </div>
    <div class="flowchart-img-wrap" style="justify-content:flex-start;">
      <img src="../../images/wh_line_power.png" alt="전원 On/Off 이미지" style="width:512px; max-width:100%;" />
    </div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
