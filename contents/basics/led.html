<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LED 상태 표시등 안내 - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">LED 상태 표시등 안내</h1>
    <div class="spec-table-wrap">
      <table class="spec-table">
        <thead><tr><th>LED 색상/패턴</th><th>상태</th></tr></thead>
        <tbody>
          <tr><td><span class="led led-blue">●</span> 파란색 점등</td><td>블루투스 연결 완료</td></tr>
          <tr><td><span class="led led-white">●</span> 흰색 점등</td><td>전원 켜짐</td></tr>
          <tr><td><span class="led led-red">●</span> 빨간색 점등</td><td>전원 끄기 / 오류</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
