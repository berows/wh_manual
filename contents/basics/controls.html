<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>조작부 사용법 - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">조작부 사용법</h1>
    <div class="spec-table-wrap">
      <table class="spec-table">
        <thead><tr><th>조작</th><th>동작</th></tr></thead>
        <tbody>
          <tr><td>전원 버튼 1회 클릭</td><td>재생 / 일시정지</td></tr>
          <tr><td>전원 버튼 2회 클릭</td><td>다음 트랙</td></tr>
          <tr><td>전원 버튼 3회 클릭</td><td>이전 트랙</td></tr>
          <tr><td>볼륨 + 1회 클릭</td><td>볼륨 증가</td></tr>
          <tr><td>볼륨 - 1회 클릭</td><td>볼륨 감소</td></tr>
          <tr><td>볼륨 + 길게 누르기</td><td>음성 어시스턴트 호출</td></tr>
          <tr><td>전원 버튼 길게 누르기 (통화 중)</td><td>통화 종료</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
