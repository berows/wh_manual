<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사용전 기본 확인 사항 - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">사용전 기본 확인 사항</h1>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>전원 연결 확인</h3><p>키오스크의 전원 연결을 확인하세요.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>프린터 점검</h3><p>프린터 전원 및 용지를 점검하세요. 용지 장착 방법은 프린터 안쪽에 적혀 있습니다.</p></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><h3>오디오 장치 연결 확인</h3><p>사운드카드, 마이크, 헤드폰이 모두 연결되어 있는지 확인하세요.</p></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body"><h3>헤드폰 연결 확인</h3><p>화면 상단 헤드폰 아이콘 표시를 확인하세요.</p></div></div>
      <div class="step"><div class="step-num">5</div><div class="step-body"><h3>인터넷 연결 확인</h3><p>안드로이드 설정에서 설치 환경별 유무선 연결을 확인하세요.</p></div></div>
      <div class="step"><div class="step-num">6</div><div class="step-body"><h3>음향 확인</h3><p>볼륨을 MAX로 설정하세요.</p></div></div>
    </div>
    <div class="flowchart-img-wrap"></div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
