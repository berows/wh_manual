<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사용전 기본 확인 사항 - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">사용전 기본 확인 사항</h1>
    <div class="alert-box warning">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <p>후면부 커버 임의 개패 금지</p>
    </div>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>전원 연결 확인</h3><p>키오스크의 전원 연결을 확인하세요.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>프린터 점검</h3><p>프린터 전원 및 용지를 점검하세요. 용지 장착 방법은 프린터 안쪽에 적혀 있습니다.</p></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><h3>오디오 장치 연결 확인</h3><p>사운드 카드와 헤드폰이 연결되어 있는지 확인하세요.</p></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body"><h3>헤드폰 연결 확인</h3><p>화면 상단 헤드폰 아이콘 표시를 확인하세요.</p></div></div>
      <div class="step"><div class="step-num">5</div><div class="step-body"><h3>인터넷 연결 확인</h3><p>안드로이드 설정에서 설치 환경 별 유/무선 인터넷 연결을 확인하세요.</p></div></div>
      <div class="step"><div class="step-num">6</div><div class="step-body"><h3>음향 확인</h3><p>기기 볼륨이 MAX 상태인지 확인하세요.</p></div></div>
    </div>
    <div class="flowchart-img-wrap" style="justify-content:flex-start;">
      <img src="../../images/wh_line_back.png" alt="사용전 기본 확인 이미지" style="width:512px; max-width:100%;" />
    </div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
