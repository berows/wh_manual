<body>
  <div id="pageContent">
    <h1 class="page-title">충전 및 배터리 상태 확인</h1>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>충전 케이블 연결</h3><p>제공된 USB-C 케이블을 WithHear 충전 포트에 연결합니다.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>충전 상태 확인</h3><p>LED가 빨간색으로 점등되면 충전 중입니다. 완충 시 LED가 흰색으로 점등됩니다.</p></div></div>
    </div>
    <div class="alert-box warning">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      충전 중에는 사용하지 않는 것을 권장합니다. 공인 충전 케이블 이외의 사용은 기기 손상을 유발할 수 있습니다.
    </div>
  </div>
