<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>초기화(Reset) 방법 - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">초기화(Reset) 방법</h1>
    <div class="alert-box warning">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      초기화 시 페어링 정보 및 설정이 모두 삭제됩니다. 반드시 아래 단계를 따르세요.
    </div>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>전원이 켜진 상태 확인</h3><p>기기가 켜져 있는지 확인합니다.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>볼륨 + / 볼륨 - 동시에 10초 이상 누르기</h3><p>LED가 빨간색으로 3회 점멸하면 초기화가 시작됩니다.</p></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><h3>재부팅 완료</h3><p>기기가 자동으로 재부팅됩니다. 초기화 완료 후 페어링 모드로 진입합니다.</p></div></div>
    </div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
