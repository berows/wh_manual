<!DOCTYPE html>

<head>

<body>
  <div id="pageContent">
    <h1 class="page-title">다중 기기 연결 (Multi-point)</h1>
    <p>WithHear는 최대 2대의 기기와 동시에 연결할 수 있는 Multi-point 기능을 지원합니다.</p>
    <div class="alert-box info">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Multi-point 기능은 앱 설정에서 활성화할 수 있습니다. 기기 A에서 음악 재생 중 기기 B에서 전화가 오면 자동으로 전환됩니다.
    </div>
    <div class="content-placeholder"><p class="placeholder-label">상세 콘텐츠 작성 예정</p></div>
  </div>
