<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자동 청력 검사 - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">자동 청력 검사</h1>
    <p class="page-desc">WithHear™의 핵심 기능으로 셀프 청력검사와 고막 확인, 검사 결과 전송이 가능합니다.</p>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>WithHear 앱 실행</h3></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>원하는 검사 항목 터치</h3></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><h3>화면의 안내에 따라 버튼을 터치해서 진행</h3></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body"><h3>검사 종류에 따라 헤드폰 및 이경 카메라 사용</h3></div></div>
      <div class="step"><div class="step-num">5</div><div class="step-body"><h3>검사세션 종료 후 검사결과 확인</h3></div></div>
      <div class="step"><div class="step-num">6</div><div class="step-body"><h3>검사결과는 프린트 or 모바일 전송 가능</h3></div></div>
    </div>
    <div class="flowchart-img-wrap" style="justify-content:flex-start;">
      <img src="../../images/wh_line_audiometry.png" alt="자동 청력 검사 이미지" style="width:512px; max-width:100%;" />
    </div>
  </div>
  <script src="../../script.js"></script>

</html>
