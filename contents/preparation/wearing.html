<!DOCTYPE html>
<html lang="ko">
<head>

<body>
  <div id="pageContent">
    <h1 class="page-title">키오스크 설치</h1>
    <div class="alert-box warning">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 56" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M60.41,45.97L36.19,4.03c-1.08-1.88-3.02-3-5.19-3s-4.11,1.12-5.19,3L1.59,45.97c-1.08,1.88-1.08,4.12,0,6,1.08,1.88,3.02,3,5.19,3h48.43c2.17,0,4.11-1.12,5.19-3,1.08-1.88,1.08-4.12,0-6ZM57.81,50.47c-.54.94-1.51,1.5-2.59,1.5H6.79c-1.08,0-2.05-.56-2.59-1.5-.54-.94-.54-2.06,0-3L28.41,5.53c.54-.94,1.51-1.5,2.59-1.5s2.05.56,2.59,1.5l24.21,41.94c.54.94.54,2.06,0,3Z"/><path d="M30.51,37.7c.49,0,.85-.12,1.07-.37.22-.25.33-.67.33-1.27v-17.63c0-.65-.11-1.08-.33-1.31-.22-.22-.58-.33-1.07-.33s-.85.12-1.07.35c-.22.23-.33.65-.33,1.25v17.71c0,.6.11,1.01.33,1.25.22.23.58.35,1.07.35Z"/><path d="M30.51,41.95c-.57,0-1.06.2-1.46.6s-.6.9-.6,1.5c0,.55.2,1.03.6,1.44s.89.62,1.46.62,1.07-.21,1.48-.62c.42-.42.62-.9.62-1.44,0-.6-.21-1.1-.62-1.5-.42-.4-.91-.6-1.48-.6Z"/></svg>
      <p>초기 설치는 전문 기사가 진행합니다. 본 문서는 참조용으로만 확인해주세요.</p>
    </div>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>본체 및 스탠드 설치</h3><p>테이블에 기기를 조심스럽게 눕힌 후 받침대(플레이트)를 부착하고 평평한 곳에 설치하세요.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>전원 케이블 연결</h3><p>키오스크와 전원 케이블을 연결합니다.</p></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><h3>전원 켜기</h3><p>전원버튼을 누르면, 전원에 파란색 불이 들어와 키오스크가 실행됩니다.</p></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body"><h3>프로그램 실행</h3><p>키오스크가 켜지면 환경설정 후 청력검사 프로그램을 실행합니다.</p></div></div>
    </div>
    <div class="flowchart-img-wrap" style="justify-content:flex-start;">
      <img src="../../images/wh_line_comp.png" alt="설치 순서도" style="width:512px; max-width:100%;" />
    </div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
