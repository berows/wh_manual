<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>키오스크 설치순서 - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">키오스크 설치순서</h1>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>본체 설치</h3><p>평평하고 안정적인 바닥에 본체를 설치하세요.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>전원 케이블 연결</h3><p>키오스크와 전원 케이블을 연결합니다.</p></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><h3>전원 켜기</h3><p>전원버튼을 누르면, 전원에 파란색 불이 들어와 키오스크가 실행됩니다.</p></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body"><h3>프로그램 자동 실행</h3><p>키오스크가 켜지면서 자동으로 청력검사 프로그램이 실행됩니다.</p></div></div>
    </div>
    <div class="flowchart-img-wrap">
      <img src="../../images/install_flowchart.png" alt="설치 순서도" class="flowchart-img" />
    </div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
