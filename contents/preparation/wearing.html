<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>착용 및 연결 방법 - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">착용 및 연결 방법</h1>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>이어팁 크기 선택</h3><p>귀에 맞는 이어팁 크기(S/M/L)를 선택하여 본체에 장착합니다. 기본 제공 이어팁은 M 사이즈입니다.</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>귀에 착용</h3><p>이어팁을 귀에 부드럽게 삽입하고 본체가 귀 뒤쪽으로 자연스럽게 걸리도록 위치를 조정합니다.</p></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><h3>전원 켜기</h3><p>전원 버튼을 3초간 길게 눌러 전원을 켭니다. LED가 흰색으로 점등되면 전원이 켜진 상태입니다.</p></div></div>
    </div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
