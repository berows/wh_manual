<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>각 부의 명칭 및 기능 - WithHear 온라인 매뉴얼</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div id="pageContent">
    <h1 class="page-title">각 부의 명칭 및 기능</h1>
    <div class="steps no-line horizontal">
      <div class="step"><div class="step-num">1</div><div class="step-body"><h3>터치스크린</h3><p>WithHear™ 검사 앱 조작</p></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body"><h3>헤드폰</h3><p>순음, 소음하 청력 검사시 착용</p></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body"><h3>프린터</h3><p>청력 검사 결과를 출력</p></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body"><h3>확장 입출력 포트</h3><p>추가 장비 연결을 위한 USB-A포트 2구</p></div></div>
      <div class="step"><div class="step-num">5</div><div class="step-body"><h3>전원 스위치</h3><p>기기 전원 조작부 버튼 (상태 표시등)</p></div></div>
      <div class="step"><div class="step-num">6</div><div class="step-body"><h3>이경 카메라</h3><p>고막 검사용 카메라 (옵션)</p></div></div>
    </div>
    <div class="flowchart-img-wrap" style="justify-content:flex-start;">
      <img src="../../images/wh_line_desc.png" alt="각 부의 명칭 이미지" style="width:512px; max-width:100%;" />
    </div>
  </div>
  <script src="../../script.js"></script>
</body>
</html>
